# apt-proxy distributions configuration
# Add or edit distributions and mirrors here. Reload with SIGHUP or POST /api/mirrors/refresh.
# If mirrors.official/custom are empty for a distribution, built-in mirrors are used for that dist.

distributions:
  - id: ubuntu
    name: Ubuntu
    type: 1
    url_pattern: "/ubuntu/(.+)$"
    benchmark_url: "dists/noble/main/binary-amd64/Release"
    geo_mirror_api: "http://mirrors.ubuntu.com/mirrors.txt"
    cache_rules:
      - pattern: "deb$"
        cache_control: "max-age=100000"
        rewrite: true
      - pattern: "udeb$"
        cache_control: "max-age=100000"
        rewrite: true
      - pattern: "InRelease$"
        cache_control: "max-age=3600"
        rewrite: true
      - pattern: "DiffIndex$"
        cache_control: "max-age=3600"
        rewrite: true
      - pattern: "PackagesIndex$"
        cache_control: "max-age=3600"
        rewrite: true
      - pattern: "Packages\\.(bz2|gz|lzma)$"
        cache_control: "max-age=3600"
        rewrite: true
      - pattern: "SourcesIndex$"
        cache_control: "max-age=3600"
        rewrite: true
      - pattern: "Sources\\.(bz2|gz|lzma)$"
        cache_control: "max-age=3600"
        rewrite: true
      - pattern: "Release(\\.gpg)?$"
        cache_control: "max-age=3600"
        rewrite: true
      - pattern: "Translation-(en|fr)\\.(gz|bz2|bzip2|lzma)$"
        cache_control: "max-age=3600"
        rewrite: true
      - pattern: "/by-hash/"
        cache_control: "max-age=3600"
        rewrite: true
    mirrors:
      official:
        - "archive.ubuntu.com/ubuntu/"
        - "us.archive.ubuntu.com/ubuntu/"
        - "mirrors.kernel.org/ubuntu/"
      custom: []
    aliases:
      us: "us.archive.ubuntu.com/ubuntu/"
      kernel: "mirrors.kernel.org/ubuntu/"

  - id: ubuntu-ports
    name: Ubuntu Ports
    type: 2
    url_pattern: "/ubuntu-ports/(.+)$"
    benchmark_url: "dists/noble/InRelease/Release"
    geo_mirror_api: "http://mirrors.ubuntu.com/mirrors.txt"
    cache_rules:
      - pattern: "deb$"
        cache_control: "max-age=100000"
        rewrite: true
      - pattern: "udeb$"
        cache_control: "max-age=100000"
        rewrite: true
      - pattern: "InRelease$"
        cache_control: "max-age=3600"
        rewrite: true
      - pattern: "DiffIndex$"
        cache_control: "max-age=3600"
        rewrite: true
      - pattern: "PackagesIndex$"
        cache_control: "max-age=3600"
        rewrite: true
      - pattern: "Packages\\.(bz2|gz|lzma)$"
        cache_control: "max-age=3600"
        rewrite: true
      - pattern: "SourcesIndex$"
        cache_control: "max-age=3600"
        rewrite: true
      - pattern: "Sources\\.(bz2|gz|lzma)$"
        cache_control: "max-age=3600"
        rewrite: true
      - pattern: "Release(\\.gpg)?$"
        cache_control: "max-age=3600"
        rewrite: true
      - pattern: "Translation-(en|fr)\\.(gz|bz2|bzip2|lzma)$"
        cache_control: "max-age=3600"
        rewrite: true
      - pattern: "/by-hash/"
        cache_control: "max-age=3600"
        rewrite: true
    mirrors:
      official:
        - "ports.ubuntu.com/ubuntu-ports/"
        - "mirrors.kernel.org/ubuntu-ports/"
      custom: []
    aliases:
      official: "ports.ubuntu.com/ubuntu-ports/"
      kernel: "mirrors.kernel.org/ubuntu-ports/"

  - id: debian
    name: Debian
    type: 3
    url_pattern: "/debian(-security)?/(.+)$"
    benchmark_url: "dists/bookworm/main/binary-amd64/Release"
    cache_rules:
      - pattern: "deb$"
        cache_control: "max-age=100000"
        rewrite: true
      - pattern: "udeb$"
        cache_control: "max-age=100000"
        rewrite: true
      - pattern: "InRelease$"
        cache_control: "max-age=3600"
        rewrite: true
      - pattern: "DiffIndex$"
        cache_control: "max-age=3600"
        rewrite: true
      - pattern: "PackagesIndex$"
        cache_control: "max-age=3600"
        rewrite: true
      - pattern: "Packages\\.(bz2|gz|lzma)$"
        cache_control: "max-age=3600"
        rewrite: true
      - pattern: "SourcesIndex$"
        cache_control: "max-age=3600"
        rewrite: true
      - pattern: "Sources\\.(bz2|gz|lzma)$"
        cache_control: "max-age=3600"
        rewrite: true
      - pattern: "Release(\\.gpg)?$"
        cache_control: "max-age=3600"
        rewrite: true
      - pattern: "Translation-(en|fr)\\.(gz|bz2|bzip2|lzma)$"
        cache_control: "max-age=3600"
        rewrite: true
      - pattern: "/by-hash/"
        cache_control: "max-age=3600"
        rewrite: true
    mirrors:
      official:
        - "deb.debian.org/debian/"
        - "ftp.us.debian.org/debian/"
      custom: []
    aliases:
      us: "ftp.us.debian.org/debian/"

  - id: centos
    name: CentOS
    type: 4
    url_pattern: "/centos/(.+)$"
    benchmark_url: "TIME"
    cache_rules:
      - pattern: "repomd.xml$"
        cache_control: "max-age=3600"
        rewrite: true
      - pattern: "filelist.gz$"
        cache_control: "max-age=3600"
        rewrite: true
      - pattern: "dir_sizes$"
        cache_control: "max-age=3600"
        rewrite: true
      - pattern: "TIME$"
        cache_control: "max-age=3600"
        rewrite: true
      - pattern: "timestamp.txt$"
        cache_control: "max-age=3600"
        rewrite: true
      - pattern: ".*"
        cache_control: "max-age=100000"
        rewrite: true
    mirrors:
      official:
        - "mirror.stream.centos.org/centos/"
        - "vault.centos.org/centos/"
        - "mirrors.kernel.org/centos/"
      custom: []
    aliases:
      stream: "mirror.stream.centos.org/centos/"
      vault: "vault.centos.org/centos/"
      kernel: "mirrors.kernel.org/centos/"

  - id: alpine
    name: Alpine Linux
    type: 5
    url_pattern: "/alpine/(.+)$"
    benchmark_url: "MIRRORS.txt"
    cache_rules:
      - pattern: "APKINDEX.tar.gz$"
        cache_control: "max-age=3600"
        rewrite: true
      - pattern: "tar.gz$"
        cache_control: "max-age=3600"
        rewrite: true
      - pattern: "apk$"
        cache_control: "max-age=3600"
        rewrite: true
      - pattern: ".*"
        cache_control: "max-age=100000"
        rewrite: true
    mirrors:
      official:
        - "dl-cdn.alpinelinux.org/alpine/"
        - "mirrors.kernel.org/alpine/"
      custom: []
    aliases:
      cdn: "dl-cdn.alpinelinux.org/alpine/"
      kernel: "mirrors.kernel.org/alpine/"
