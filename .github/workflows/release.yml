name: Release

on:
  workflow_call:

permissions:
  contents: write
  packages: write
  id-token: write

env:
  GO_VERSION: "1.27.0"

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GO111MODULE: on
      DOCKER_CLI_EXPERIMENTAL: "enabled"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate and Push Git Tag
        id: create_tag
        run: |
          # Fetch all tags to determine previous build count for today
          git fetch --tags

          # Date format: YY.MM.DD (e.g., 26.09.14)
          DATE_PREFIX=$(date -u +'%y.%m.%d')

          # Count existing tags created today to determine increment
          TODAY_TAG_COUNT=$(git tag -l "v${DATE_PREFIX}-*" | wc -l | tr -d ' ')
          BUILD_NUM=$((TODAY_TAG_COUNT + 1))

          TAG_NAME="v${DATE_PREFIX}-build${BUILD_NUM}"
          echo "Generated tag: ${TAG_NAME}"

          # Configure git user for tagging
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Create and push tag
          git tag -a "${TAG_NAME}" -m "Automated release ${TAG_NAME}"
          git push origin "${TAG_NAME}"

          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Install Syft (for SBOM generation)
        uses: anchore/sbom-action/download-syft@v0

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ github.repository_owner }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        if: success()
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
