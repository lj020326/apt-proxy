repos:
  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        entry: gofmt -w -s
        language: system
        files: \.go$
        pass_filenames: true
        stages: [pre-commit]

      - id: golangci-lint
        name: golangci-lint
        entry: golangci-lint run
        language: system
        types: [go]
        pass_filenames: false
        require_serial: true
        stages: [pre-commit]

      - id: go-test
        name: go test
        entry: go test ./internal/...
        language: system
        types: [go]
        pass_filenames: false
        require_serial: true
        stages: [pre-push]
