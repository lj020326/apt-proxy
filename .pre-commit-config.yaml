# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        entry: gofmt -w -s
        language: system
        files: \.go$
        pass_filenames: true

      - id: golangci-lint
        name: golangci-lint
        entry: golangci-lint run
        language: system
        types: [go]
        pass_filenames: false
        require_serial: true

      - id: go-test
        name: go test
        entry: go test ./internal/...
        language: system
        types: [ go ]
        pass_filenames: false
        require_serial: true
